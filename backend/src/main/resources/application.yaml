spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/routeledger
    username: user
    password: user
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    # Spring AI (Google GenAI / Gemini) Configuration
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash

jwt:
  secret: ${JWT_KEY}
  expiration: 86400000

server:
  port: 8081

