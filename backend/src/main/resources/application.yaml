spring:
  application:
    name: backend

    datasource:
      url: jdbc:postgresql://localhost:5432/routeledger
      username: postgres
      password: password
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    # Spring AI (Google GenAI / Gemini) Configuration
    ai:
      google:
        genai:
          api-key: ${GEMINI_API_KEY}
          chat:
            options:
              model: gemini-2.5-flash

server:
  port: 8081

